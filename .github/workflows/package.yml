name: Package artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - run: cargo build --release -p app -p app-cli
      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash packaging/linux/package.sh
      - name: Package macOS
        if: runner.os == 'macOS'
        run: bash packaging/macos/package.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: app-template-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
