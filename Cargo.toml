[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["apps/app", "apps/app-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
app-core = { path = "crates/core" }
app-model = { path = "crates/model" }
app-engine = { path = "crates/engine" }
app-platform = { path = "crates/platform" }
app-ui-egui = { path = "crates/ui-egui" }
app-mcp = { path = "crates/mcp" }
app-testkit = { path = "crates/testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
