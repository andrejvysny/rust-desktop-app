[package]
name = "app-web"
description = "Optional browser frontend for the application template"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
app-ui-egui.workspace = true
eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
egui.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "console"] }
